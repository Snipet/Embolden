<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Embolden</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="head">
    <h1 class="wordmark"><span class="mark">Emb<svg class="stroke" viewBox="0 0 60 8" preserveAspectRatio="none" aria-hidden="true"><path d="M1 3.9 C 16 1.9, 40 1.7, 59 2.9 L 59 4.3 C 40 4.1, 15 5.1, 1 6.9 Z"/></svg></span>olden</h1>
    <label class="power" title="Turn Embolden on or off everywhere">
      <input type="checkbox" id="master-toggle" aria-label="Enable Embolden everywhere">
      <span class="power-track"><span class="power-knob"></span></span>
    </label>
  </header>

  <section class="stage">
    <p class="page" id="preview"></p>
    <div class="stage-foot">
      <p class="stage-note" id="stage-note" role="status"></p>
      <span class="stage-tag">live preview</span>
    </div>
  </section>

  <div class="controls">
    <section class="control">
      <div class="control-head">
        <span class="control-name" id="coverage-name">Anchor</span>
        <output class="value" id="coverage-value" for="coverage">45%</output>
      </div>
      <input class="range" type="range" id="coverage" aria-labelledby="coverage-name">
      <p class="hint">How much of each word gets bolded.</p>
    </section>

    <section class="control">
      <div class="control-head">
        <span class="control-name" id="weight-name">Ink</span>
        <output class="value" id="weight-value">Bold</output>
      </div>
      <div class="strip specimen" role="radiogroup" aria-labelledby="weight-name" id="weight-group">
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-weight="500" aria-label="Light (500)">Ag</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-weight="600" aria-label="Semibold (600)">Ag</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-weight="700" aria-label="Bold (700)">Ag</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-weight="800" aria-label="Extra bold (800)">Ag</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-weight="900" aria-label="Black (900)">Ag</button>
      </div>
      <p class="hint">How heavy the bolded part looks.</p>
    </section>

    <section class="control">
      <div class="control-head">
        <span class="control-name" id="jitter-name">Variation</span>
      </div>
      <div class="strip words" role="radiogroup" aria-labelledby="jitter-name" id="jitter-group">
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-jitter="0">Off</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-jitter="1">Subtle</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-jitter="2">Mixed</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-jitter="3">Wild</button>
      </div>
      <p class="hint">Varies the anchor length word by word, so the rhythm never flattens out.</p>
    </section>
  </div>

  <section class="site" id="site-row">
    <span class="monogram" id="site-monogram" aria-hidden="true"></span>
    <div class="site-text">
      <span class="site-label">On this site</span>
      <span class="site-host" id="site-host">…</span>
    </div>
    <label class="power small" id="site-switch">
      <input type="checkbox" id="site-toggle" disabled aria-label="Enable Embolden on this site">
      <span class="power-track"><span class="power-knob"></span></span>
    </label>
  </section>

  <footer class="foot">
    <span><kbd>Alt</kbd><kbd>B</kbd> toggles this site</span>
    <button type="button" id="reset" title="Restore Anchor, Ink, and Variation to their defaults (your per-site choices are kept)">Reset</button>
  </footer>

  <script src="../src/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
